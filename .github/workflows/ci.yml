name: Verify React runtime

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install declared Yarn version and dependencies
        run: |
          corepack enable
          yarn install --immutable
      - name: Lint
        run: yarn lint
      - name: Test and type-check
        run: yarn test:coverage
      - name: Build
        env:
          VITE_API_URL: https://api.example.com/api/v1
        run: yarn build
      - name: Check bundle budgets and budget regression test
        run: |
          yarn test:bundle
          yarn check:bundle
      - name: Install Chromium
        run: yarn playwright install --with-deps chromium
      - name: Production browser regressions
        run: yarn test:e2e
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7
